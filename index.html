      const [tela, setTela] = React.useState('inicio');

        const senha = prompt("Acesso do Professor: Digite a senha para adaptar a prova");
        if (senha === SENHA_PROFESSOR) {
          const nivel = prompt("Digite o Nível:\n1 para PROVA LEVE\n2 para SUPER ADAPTADA (DI)");

            setTipoProva('leve');
            alert("✅ Prova LEVE ativada para este aluno!");
          } else if (nivel === '2') {
            setTipoProva('di');
            alert("✅ Prova SUPER ADAPTADA (DI) ativada!");
          } else {
            alert("❌ Opção inválida.");
          }
        } else if (senha) {
          alert("❌ Senha incorreta.");
        }
      };
      // ===================================

      const [questoesProva, setQuestoesProva] = React.useState([]); 
      const [questaoAtual, setQuestaoAtual] = React.useState(0);
      const [respostas, setRespostas] = React.useState({});

      const [senhaInput, setSenhaInput] = React.useState('');
      const [erroSenha, setErroSenha] = React.useState('');
      const [submissoes, setSubmissoes] = React.useState([]);
      const [alunoSelecionado, setAlunoSelecionado] = React.useState(null);

      const valorPorQuestao = VALOR_TOTAL_PROVA / (tipoProva === 'padrao' ? BANCO_DE_QUESTOES.length : (tipoProva === 'leve' ? BANCO_DE_QUESTOES_ADAPTADAS_LEVE.length : BANCO_DE_QUESTOES_DI.length));

      // Função Anti-Cola (Embaralha)
      const embaralharArray = (array) => {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      const iniciarProva = () => {
        const nomePalavras = aluno.nome.trim().split(' ');
        if (nomePalavras.length < 2) {
          setErroNome('Por favor, escreva seu nome completo (nome e sobrenome).');
          return;
        }
        if (!aluno.turma) {
          setErroNome('Por favor, selecione sua turma.');
          return;
        }

        // ESCOLHE O BANCO BASEADO NA OPÇÃO DO PROFESSOR
        let bancoSelecionado = BANCO_DE_QUESTOES;
        if (tipoProva === 'leve') bancoSelecionado = BANCO_DE_QUESTOES_ADAPTADAS_LEVE;
        if (tipoProva === 'di') bancoSelecionado = BANCO_DE_QUESTOES_DI;

        let processadas = bancoSelecionado.map(q => {
          if (q.tipo === 'objetiva' || q.tipo === 'objetiva_visual' || q.tipo === 'certo_errado') {
            let alts = q.alternativas.map((alt, idx) => ({
              texto: alt.replace(/^[A-Ea-e]\)\s*/, '').trim(),
              isCorreta: idx === q.respostaCorreta
            }));
            // Nas adaptadas não embaralhamos as opções para não confundir o aluno
            return { ...q, altsObj: tipoProva === 'padrao' ? embaralharArray(alts) : alts };
          }
          return q;
        });

        // Nas adaptadas não embaralhamos a ordem das questões
        setQuestoesProva(tipoProva === 'padrao' ? embaralharArray(processadas) : processadas);
        setErroNome('');
        setRespostas({});
        setQuestaoAtual(0);
        setTela('prova');
      };

      const registrarResposta = (valor) => {
        const q = questoesProva[questaoAtual];
        setRespostas({ ...respostas, [q.id]: valor });
      };

      const proximaQuestao = () => {
        if (questaoAtual < questoesProva.length - 1) {
          setQuestaoAtual(questaoAtual + 1);
        } else {
          finalizarProva();
        }
      };

      const finalizarProva = async () => {
        setIsSubmitting(true);
        
        if (firebaseConfig.apiKey === "SUA_API_KEY") {
          alert("Erro: Configure o Firebase no código.");
          setIsSubmitting(false);
          return;
        }

        let notaCalculada = 0;
        let respostasParaBanco = {};

        questoesProva.forEach(q => {
          const resp = respostas[q.id];
          
          // 1. Corrige questões normais de múltipla escolha
          if (['objetiva', 'objetiva_visual', 'certo_errado'].includes(q.tipo)) {
            if (resp && resp.isCorreta) notaCalculada += valorPorQuestao;
            respostasParaBanco[q.id] = resp ? resp.texto : 'Em branco';
          } 
          // 2. Corrige a questão de completar a letra
          else if (q.tipo === 'completar') {
            if (resp && resp === q.respostaCorretaTexto) notaCalculada += valorPorQuestao;
            respostasParaBanco[q.id] = resp ? String(resp) : 'Em branco';
          } 
          // 3. Corrige a questão do EMOJI (Opinião - Qualquer resposta ganha ponto!)
          else if (q.tipo === 'emoji') {
            if (resp) notaCalculada += valorPorQuestao;
            respostasParaBanco[q.id] = resp ? resp.texto : 'Em branco';
          }
          // 4. Corrige desenhos e discursivas
          else {
            if (resp && String(resp).trim() !== '') notaCalculada += valorPorQuestao;
            respostasParaBanco[q.id] = resp ? String(resp) : 'Em branco';
          }
        });

        setNotaFinal(notaCalculada);

        try {
          await db.collection("avaliacoes").add({
            nome: aluno.nome,
            turma: aluno.turma,
            nota: notaCalculada.toFixed(2),
            respostas: respostasParaBanco,
            data: new Date().toISOString()
          });
          setTela('resultado');
        } catch (error) {
          alert("Erro ao salvar. Verifique o Firebase.");
        }
        setIsSubmitting(false);
      };

      const acessarAdmin = async () => {
        if (senhaInput === SENHA_PROFESSOR) {
          setErroSenha('');
          setTela('admin');
          if (firebaseConfig.apiKey === "SUA_API_KEY") return;
          try {
            const snapshot = await db.collection("avaliacoes").orderBy("data", "desc").get();
            const dados = [];
            snapshot.forEach((doc) => dados.push({ id: doc.id, ...doc.data() }));
            setSubmissoes(dados);
          } catch(e) {
             alert("Erro ao buscar dados.");
          }
        } else {
          setErroSenha('Senha incorreta!');
        }
      };

      const exportarCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Data;Nome;Turma;Nota;Respostas Discursivas\n";
        
        submissoes.forEach(sub => {
          const dataFormatada = new Date(sub.data).toLocaleString('pt-BR');
          let respostasDiscursivas = "";
          
          BANCO_DE_QUESTOES.forEach((q, idx) => {
            if(q.tipo === 'discursiva') {
              const textoLimpo = (sub.respostas[q.id] || 'Em branco').replace(/(\r\n|\n|\r)/gm, " ");
              respostasDiscursivas += `Q${q.id}: ${textoLimpo} | `;
            }
          });
          
          const linha = `"${dataFormatada}";"${sub.nome}";"${sub.turma}";"${sub.nota}";"${respostasDiscursivas}"`;
          csvContent += linha + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "relatorio_notas_ed_fisica.csv");
        document.body.appendChild(link);
        link.click();
      };

      // 👇 COLEI O PASSO 1 EXATAMENTE AQUI 👇
      const excluirProva = async (id) => {
        const confirmacao = window.confirm("Tem certeza que deseja excluir esta prova? Essa ação não pode ser desfeita.");
        if (confirmacao) {
          try {
            await db.collection("avaliacoes").doc(id).delete();
            // Atualiza a lista na tela removendo a prova apagada
            setSubmissoes(submissoes.filter(sub => sub.id !== id));
            alert("Prova excluída com sucesso!");
          } catch (error) {
            alert("Erro ao excluir. Verifique sua conexão.");
          }
        }
      };
      // 👆 FIM DO PASSO 1 👆

      return (
        <div className="min-h-screen">
          
          {/* ================= TELA INICIAL ================= */}
          {tela === 'inicio' && (
            <div className="max-w-md mx-auto pt-12 px-6 flex flex-col items-center">
              <div className="bg-orange-500 p-4 rounded-full mb-6 shadow-lg text-4xl">🏃</div>
              <h1 className="text-3xl font-black text-center text-slate-900 mb-2">Avaliação Bimestral</h1>
              <div className="bg-green-100 text-green-800 px-4 py-1 rounded-full font-bold text-lg mb-8 shadow-sm">
                Valor: {VALOR_TOTAL_PROVA.toFixed(1)} Pontos
              </div>

              <div className="w-full bg-white rounded-2xl shadow-xl p-6 mb-8 border-t-4 border-orange-500">
                <h2 className="text-lg font-bold mb-4">📖 Conteúdos da Prova:</h2>
                <ul className="list-disc list-inside text-slate-600 mb-6 space-y-1">
                  {CONTEUDOS_PROVA.map((c, i) => <li key={i}>{c}</li>)}
                </ul>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold mb-1">Nome Completo</label>
                    <input type="text" placeholder="Digite seu nome e sobrenome" className="w-full px-4 py-3 rounded-lg border focus:ring-2 outline-none" value={aluno.nome} onChange={(e) => setAluno({...aluno, nome: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold mb-1">Turma</label>
                    <select className="w-full px-4 py-3 rounded-lg border bg-white focus:ring-2 outline-none" value={aluno.turma} onChange={(e) => setAluno({...aluno, turma: e.target.value})}>
                      <option value="">Selecione sua turma...</option>
                      {TURMAS.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                  {erroNome && <p className="text-red-500 text-sm font-bold">{erroNome}</p>}
                </div>
              </div>

              {tipoProva !== 'padrao' && (
                <div className="w-full bg-purple-100 border-2 border-purple-500 text-purple-800 p-3 rounded-xl font-black text-center mb-6 animate-pulse shadow-md">
                  🧩 PROVA ADAPTADA ({tipoProva === 'leve' ? 'NÍVEL 1' : 'NÍVEL 2'}) ATIVADA!
                </div>
              )}

              <button onClick={iniciarProva} className={`w-full text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-105 ${tipoProva !== 'padrao' ? 'bg-purple-600 hover:bg-purple-700' : 'bg-orange-500 hover:bg-orange-600'}`}>
                {tipoProva !== 'padrao' ? 'COMEÇAR MISSÃO 🚀' : 'INICIAR PROVA ➡️'}
              </button>
              
              <div className="mt-12 flex gap-6">
                <button onClick={() => setTela('loginAdmin')} className="text-slate-400 p-2 text-2xl hover:text-slate-600 transition" title="Área do Professor">🔒</button>
                <button onClick={ativarModoAdaptado} className="text-slate-400 p-2 text-2xl hover:text-purple-600 transition" title="Adaptar Prova para este aluno">🧩</button>
              </div>
            </div>
          )}

          {/* ================= TELA DA PROVA ================= */}
          {tela === 'prova' && (
            <div className="max-w-2xl mx-auto pt-8 px-4 pb-8">
              <div className="mb-6">
                <div className="flex justify-between text-sm font-bold text-slate-500 mb-2">
                  <span>Questão {questaoAtual + 1} de {questoesProva.length}</span>
                  <span>{(valorPorQuestao).toFixed(2)} pts</span>
                </div>
                <div className="w-full bg-slate-200 rounded-full h-2.5">
                  <div className="bg-orange-500 h-2.5 rounded-full" style={{ width: `${((questaoAtual + 1) / questoesProva.length) * 100}%` }}></div>
                </div>
              </div>

              <div className="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
                
                {questoesProva[questaoAtual].imagem && (
                  <img src={questoesProva[questaoAtual].imagem} alt="Imagem da questão" className="w-full h-48 md:h-64 object-cover rounded-xl mb-6 shadow-sm border-2 border-slate-100" />
                )}

                <h2 className="text-xl font-bold mb-6 text-slate-800 leading-relaxed">
                  {questoesProva[questaoAtual].pergunta}
                </h2>

                {questoesProva[questaoAtual].tipo === 'objetiva' || questoesProva[questaoAtual].tipo === 'objetiva_visual' || questoesProva[questaoAtual].tipo === 'certo_errado' || questoesProva[questaoAtual].tipo === 'emoji' ? (
                  
                  <div className={`space-y-4 ${questoesProva[questaoAtual].tipo === 'emoji' ? 'flex justify-center gap-6 space-y-0' : ''}`}>
                    {(questoesProva[questaoAtual].altsObj || questoesProva[questaoAtual].alternativas.map((a, i)=>({texto: a, isCorreta: i === questoesProva[questaoAtual].respostaCorreta}))).map((altObj, idx) => {
                       const selecionada = respostas[questoesProva[questaoAtual].id]?.texto === altObj.texto;
                       return (
                         <button
                           key={idx}
                           onClick={() => registrarResposta(altObj)}
                           className={`
                             ${questoesProva[questaoAtual].tipo === 'emoji' ? 'text-7xl p-2 hover:scale-110 transition-transform bg-transparent border-0 shadow-none' : 'w-full text-left p-5 text-lg rounded-2xl border-4 transition-all'} 
                             ${selecionada && questoesProva[questaoAtual].tipo !== 'emoji' ? 'border-purple-500 bg-purple-100 font-black text-purple-900 shadow-inner' : ''}
                             ${!selecionada && questoesProva[questaoAtual].tipo !== 'emoji' ? 'border-slate-200 hover:border-purple-300 hover:bg-slate-50 text-slate-700 font-bold' : ''}
                             ${selecionada && questoesProva[questaoAtual].tipo === 'emoji' ? 'scale-125 drop-shadow-2xl' : ''}
                           `}
                         >
                           {tipoProva === 'padrao' && questoesProva[questaoAtual].tipo === 'objetiva' && <span className="font-bold mr-2">{['A', 'B', 'C', 'D'][idx]})</span>}
                           {altObj.texto}
                         </button>
                       )
                    })}
                  </div>

                ) : questoesProva[questaoAtual].tipo === 'completar' ? (
                  
                  <div className="text-center py-8">
                    <p className="text-5xl font-black tracking-widest text-slate-800 mb-6 flex items-center justify-center gap-4">
                      S A Ú D 
                      <input 
                        type="text" 
                        maxLength="1"
                        className="w-20 h-20 text-center text-5xl border-4 border-purple-500 rounded-xl bg-purple-50 text-purple-700 outline-none uppercase shadow-inner"
                        value={respostas[questoesProva[questaoAtual].id] || ''}
                        onChange={(e) => registrarResposta(e.target.value.toUpperCase())}
                      />
                    </p>
                  </div>

                ) : (
                  <div>
                    <textarea 
                      className={`w-full p-4 rounded-xl border-4 focus:border-purple-500 outline-none h-40 resize-none text-lg ${questoesProva[questaoAtual].tipo === 'desenho' ? 'border-dashed border-slate-300 bg-slate-50' : 'border-slate-200'}`} 
                      placeholder={questoesProva[questaoAtual].tipo === 'desenho' ? "Pode digitar aqui como seria o seu desenho..." : "Digite sua resposta aqui..."}
                      value={respostas[questoesProva[questaoAtual].id] || ''} 
                      onChange={(e) => registrarResposta(e.target.value)}>
                    </textarea>
                  </div>
                )}

                <button onClick={proximaQuestao} disabled={isSubmitting || respostas[questoesProva[questaoAtual].id] === undefined} className="mt-8 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-4 rounded-xl">
                  {isSubmitting ? 'Enviando para o professor...' : (questaoAtual === questoesProva.length - 1 ? 'FINALIZAR PROVA ✅' : 'PRÓXIMA QUESTÃO ➡️')}
                </button>
              </div>
            </div>
          )}

          {/* ================= TELA DE RESULTADOS ================= */}
          {tela === 'resultado' && (
            <div className="max-w-2xl mx-auto pt-12 px-4 pb-12">
              <div className="bg-white rounded-3xl shadow-xl overflow-hidden">
                <div className="bg-blue-600 p-8 text-center text-white">
                  <h2 className="text-2xl font-bold mb-2">Prova Concluída!</h2>
                  <p className="opacity-80 mb-6">{aluno.nome} • {aluno.turma}</p>
                  <div className="inline-block bg-white rounded-2xl p-6 text-slate-800 shadow-2xl">
                    <p className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">Sua Nota</p>
                    <p className="text-6xl font-black text-blue-600">{notaFinal.toFixed(1)}<span className="text-2xl text-slate-400">/{VALOR_TOTAL_PROVA.toFixed(1)}</span></p>
                  </div>
                </div>

                <div className="p-6 sm:p-8 space-y-6 bg-slate-50">
                  <h3 className="font-bold text-lg text-slate-700">Correção Automática:</h3>
                  {questoesProva.map((q, idx) => {
                    const resp = respostas[q.id];
                    // Removemos o 'emoji' daqui para ele ter uma regra própria abaixo
                    const isObjType = ['objetiva', 'objetiva_visual', 'certo_errado'].includes(q.tipo);
                    
                    return (
                      <div key={idx} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <p className="font-semibold text-slate-800 mb-3 text-sm">{idx + 1}. {q.pergunta}</p>
                        
                        {isObjType ? (
                          <div>
                            {resp && resp.isCorreta ? (
                              <div className="text-green-600 bg-green-50 p-3 rounded-lg font-medium">✅ Você acertou! ({resp.texto})</div>
                            ) : (
                              <div className="space-y-2">
                                <div className="text-red-500 bg-red-50 p-3 rounded-lg font-medium">❌ Você errou: {resp ? resp.texto : 'Não respondeu'}</div>
                                <div className="text-green-600 text-sm font-medium pl-2">↳ Resposta correta: {q.altsObj ? q.altsObj.find(a => a.isCorreta)?.texto : q.alternativas[q.respostaCorreta]}</div>
                              </div>
                            )}
                          </div>
                        ) : q.tipo === 'emoji' ? (
                          <div>
                            {resp ? (
                              <p className="text-green-600 bg-green-50 p-3 rounded-lg font-medium">✅ Opinião registrada! Você escolheu: {resp.texto} (+{valorPorQuestao.toFixed(2)} pts)</p>
                            ) : (
                              <p className="text-red-500 bg-red-50 p-3 rounded-lg font-medium">❌ Em branco (0 pts)</p>
                            )}
                          </div>
                        ) : q.tipo === 'completar' ? (
                          <div>
                            {resp === q.respostaCorretaTexto ? (
                              <div className="text-green-600 bg-green-50 p-3 rounded-lg font-medium">✅ Você acertou! ({resp})</div>
                            ) : (
                              <div className="space-y-2">
                                <div className="text-red-500 bg-red-50 p-3 rounded-lg font-medium">❌ Você errou: {resp || 'Em branco'}</div>
                                <div className="text-green-600 text-sm font-medium pl-2">↳ Resposta correta: {q.respostaCorretaTexto}</div>
                              </div>
                            )}
                          </div>
                        ) : (
                          <div>
                            <div className="bg-slate-50 border p-3 rounded-lg text-sm text-slate-600 mb-2 italic">"{resp ? String(resp) : 'Deixou em branco'}"</div>
                            {resp && String(resp).trim() !== '' ? (
                              <p className="text-green-600 text-sm font-bold">✅ Pontuação garantida (+{valorPorQuestao.toFixed(2)} pts)</p>
                            ) : (
                              <p className="text-red-500 text-sm font-bold">❌ Em branco (0 pts)</p>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* 👇 MENSAGEM E BOTÃO DE FIM DE PROVA (NOVIDADE AQUI) 👇 */}
                  <div className="bg-green-100 border-2 border-green-300 rounded-2xl p-6 text-center shadow-md mt-10">
                    <h3 className="text-green-800 font-black text-xl mb-2">✅ Tudo certo!</h3>
                    <p className="text-green-700 font-medium mb-6">Sua prova foi enviada com sucesso ao professor.</p>
                    <button 
                      onClick={() => window.location.reload()}
                      className="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg transition-transform transform hover:scale-105"
                    >
                      FIM DE PROVA 🏁
                    </button>
                  </div>
                  {/* 👆 FIM DA MENSAGEM 👆 */}

                </div>
              </div>
            </div>
          )}

          {/* ================= LOGIN ADMIN ================= */}
          {tela === 'loginAdmin' && (
            <div className="max-w-sm mx-auto pt-32 px-4">
              <div className="bg-white p-8 rounded-2xl shadow-xl text-center">
                <div className="text-5xl mb-4">🔒</div>
                <h2 className="text-xl font-bold mb-6">Painel do Professor</h2>
                <input type="password" placeholder="Senha de acesso" className="w-full px-4 py-3 rounded-lg border border-slate-300 mb-4 outline-none" value={senhaInput} onChange={(e) => setSenhaInput(e.target.value)} />
                {erroSenha && <p className="text-red-500 mb-4 text-sm font-bold">{erroSenha}</p>}
                <div className="flex gap-2">
                  <button onClick={() => setTela('inicio')} className="w-1/3 bg-slate-200 text-slate-700 font-bold py-3 rounded-xl">Voltar</button>
                  <button onClick={acessarAdmin} className="w-2/3 bg-slate-800 text-white font-bold py-3 rounded-xl">Entrar</button>
                </div>
              </div>
            </div>
          )}

          {/* ================= PLANILHA DO ADMIN ================= */}
          {tela === 'admin' && (
            <div className="max-w-5xl mx-auto pt-10 px-4 pb-12">
              
              {alunoSelecionado ? (
                <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
                  <div className="flex justify-between items-center mb-6 border-b pb-4">
                    <div>
                      <h2 className="text-2xl font-black text-slate-800">{alunoSelecionado.nome}</h2>
                      <p className="text-sm text-slate-500">Turma: <span className="font-bold text-slate-700">{alunoSelecionado.turma}</span> • Nota Final: <span className="font-black text-blue-600 text-lg">{alunoSelecionado.nota}</span></p>
                      <p className="text-xs text-slate-400 mt-1">Enviado em: {new Date(alunoSelecionado.data).toLocaleString('pt-BR')}</p>
                    </div>
                    <button 
                      onClick={() => setAlunoSelecionado(null)} 
                      className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-3 rounded-xl transition-all shadow-sm"
                    >
                      ⬅️ Voltar à Lista
                    </button>
                  </div>

                  <h3 className="font-bold text-lg text-slate-700 mb-4">Respostas detalhadas da avaliação:</h3>
                  <div className="space-y-4">
                    {Object.entries(alunoSelecionado.respostas || {}).map(([qId, resposta], idx) => (
                      <div key={idx} className="bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <p className="font-bold text-xs text-slate-400 uppercase tracking-wider mb-1">Questão ID: {qId}</p>
                        <p className="text-slate-800 font-semibold text-base">
                          {String(resposta)}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div>
                  <div className="flex justify-between items-center mb-8">
                    <h1 className="text-3xl font-black text-slate-800">Relatório de Notas</h1>
                    <button onClick={exportarCSV} className="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg">📥 Baixar Planilha (CSV)</button>
                  </div>
                  <div className="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left">
                        <thead className="bg-slate-800 text-white">
                          <tr>
                            <th className="p-4">Data e Hora</th>
                            <th className="p-4">Aluno</th>
                            <th className="p-4">Turma</th>
                            <th className="p-4 text-center">Nota Final</th>
                            <th className="p-4 text-center">Ações</th>
                          </tr>
                        </thead>
                        <tbody>
                          {submissoes.length === 0 ? (
                            <tr><td colSpan="5" className="p-8 text-center text-slate-500">Nenhuma prova entregue ainda.</td></tr>
                          ) : (
                            submissoes.map((sub) => (
                              <tr key={sub.id} className="border-b border-slate-100 hover:bg-slate-50">
                                <td className="p-4 text-sm text-slate-500">{new Date(sub.data).toLocaleTimeString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</td>
                                <td className="p-4 font-bold text-slate-800">{sub.nome}</td>
                                <td className="p-4"><span className="bg-slate-200 px-2 py-1 rounded text-xs font-bold">{sub.turma}</span></td>
                                <td className="p-4 text-center font-black text-lg text-blue-600">{sub.nota}</td>
                                <td className="p-4 text-center flex justify-center gap-2">
                                  <button 
                                    onClick={() => setAlunoSelecionado(sub)} 
                                    className="text-blue-500 hover:bg-blue-50 p-2 rounded-lg transition-colors text-xl" 
                                    title="Ver Prova do Aluno"
                                  >
                                    👁️
                                  </button>
                                  <button 
                                    onClick={() => excluirProva(sub.id)} 
                                    className="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors text-xl" 
                                    title="Excluir Prova"
                                  >
                                    🗑️
                                  </button>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <button onClick={() => setTela('inicio')} className="mt-8 text-slate-500 font-bold underline">Sair do Painel</button>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }  {/* 👈 ESTA CHAVE FECHA A FUNÇÃO AvaliacaoApp() */}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AvaliacaoApp />);
  </script>
</body>
</html>
